services:
  - type: web
    name: our-threads
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
# Note: the free plan has no persistent disk, so the SQLite file resets on
# every redeploy (but survives idle spin-down in between). To keep data
# permanently, upgrade to a paid instance and add a `disk:` block here
# mounting at e.g. /var/data, with DB_PATH=/var/data/our-threads.db.
